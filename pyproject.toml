[project]
name = "gold-mcp"
version = "1.0.0"
description = "MCP server exposing XAUUSD (gold) microstructure, macro context, and proprietary strategy intelligence to Claude, ChatGPT, Cursor and any other Model Context Protocol client."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "gold-mcp" }]
license = { text = "MIT" }
keywords = [
    "mcp", "model-context-protocol",
    "gold", "xauusd", "trading", "quant",
    "claude", "chatgpt", "cursor", "windsurf",
    "orderbook", "microstructure", "macro",
]

dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=14.0.0,<22.0.0",
    "yfinance>=0.2.40,<1.5.0",
    "numpy>=1.24.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
gold-mcp = "gold_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gold_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

